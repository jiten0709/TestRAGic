[pytest]
# Chromium only by default so a bare `pytest` finishes: the previous addopts ran
# every test three times, headed, and the run stopped responding after the first
# browser. Add browsers explicitly when you want them:
#   pytest -o addopts="" --browser firefox src/tests/generated
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video off
    --tracing retain-on-failure
    --output test-results/
    -v

testpaths = src/tests/unit src/tests/generated
# The provider unit tests are pure Python: no browser fixtures, so the
# --browser flag above does not parametrize them.
python_classes =
# Bounds the hang that used to require killing the run by hand. pytest-timeout is
# in requirements.txt; without it installed this line is only a warning.
timeout = 300
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests

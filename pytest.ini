[pytest]
addopts = 
    --browser chromium
    --browser firefox 
    --browser webkit
    --headed
    --slowmo 100
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing on
    --output test-results/
    -v
    
testpaths = src/tests/unit src/tests/generated
# The provider unit tests are pure Python: no browser fixtures, so the
# --browser flags above do not parametrize them.
python_classes =
# No `timeout =` here: pytest-timeout is not installed, so the option only ever
# produced a PytestConfigWarning. Install pytest-timeout before adding it back.
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests